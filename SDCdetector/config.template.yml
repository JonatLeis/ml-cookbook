    settings:
      # Integer; use >= 1 for meaningful tests; matmul shape [size, size]. No explicit range check in the module.
      # Preset default: 100
      size: 100

  # ----------------------------------------------------------------------
  # transformer
  # Small FP32 transformer; CPU (nproc_per_node: 1) or CUDA.
  # No dtypes, weight_decay or adam_eps option in this module.
  # For meaningful, passing training checks, use positive dimensions and
  # learning_rate > 0; width must be divisible by heads.
  transformer:
    enabled: false  # true | false; enable/disable execution.
    # Optional: replace {} with the overrides you need, e.g.:
    # run:
    #   seed: 12345       # Integer 0..9223372036854775807; otherwise controller.seed.
    #   threads: 1        # Integer >= 1; otherwise controller.threads.
    #   repeats: 2        # Integer >= 1; otherwise controller.repeats.
    #   job_timeout: 0    # Seconds >= 0; 0 = disabled; otherwise controller.job_timeout.
    run: {}
    # Optional environment overrides for this experiment job only.
    # Same name/value rules as in the global environment section.
    # Example for allreduce: environment: {NCCL_INSPECTOR_ENABLE: "1"}
    environment: {}
    settings:
      # Integer >= 1; training/optimizer steps per run().
      # Preset default: 5
      steps: 5
      # Integer >= 1; number of sequences per batch.
      # Preset default: 2
      batch_size: 2
      # Integer >= 1; sequence length.
      # Preset default: 16
      length: 16
      # Integer; use >= 2 for this template (transformer_tp enforces >= 2).
      # Preset default: 64
      vocab_size: 64
      # Integer >= 1; model width, must be divisible by heads.
      # Preset default: 32
      width: 32
      # Integer >= 1; number of attention heads; width % heads == 0 for transformers.
      # Preset default: 2
      heads: 2
      # Finite number > 0 for parameter updates; TP enforces > 0.
      # Preset default: 0.001
      learning_rate: 0.001

  # ----------------------------------------------------------------------
  # transformer_tp
  # Tensor parallelism TP=2 with independent replicas on ONE node.
  # CUDA, even rank count >= 4; requires Gloo and distinct GPU UUIDs.
  # heads must be even, width divisible by heads, vocab_size >= 2.
  # Native FP16 AdamW: adam_eps >= 0.00006103515625 when float16 is selected.
  transformer_tp:
    enabled: false  # true | false; enable/disable execution.
    # Optional: replace {} with the overrides you need, e.g.:
    # run:
    #   seed: 12345       # Integer 0..9223372036854775807; otherwise controller.seed.
    #   threads: 1        # Integer >= 1; otherwise controller.threads.
    #   repeats: 2        # Integer >= 1; otherwise controller.repeats.
    #   job_timeout: 0    # Seconds >= 0; 0 = disabled; otherwise controller.job_timeout.
    run: {}
    # Optional environment overrides for this experiment job only.
    # Same name/value rules as in the global environment section.
    # Example for allreduce: environment: {NCCL_INSPECTOR_ENABLE: "1"}
    environment: {}
    settings:
      # Integer >= 1; training/optimizer steps per run().
      # Preset default: 5
      steps: 5
      # Integer >= 1; number of sequences per batch.
      # Preset default: 2
      batch_size: 2
      # Integer >= 1; sequence length.
      # Preset default: 16
      length: 16
      # Integer; use >= 2 for this template (transformer_tp enforces >= 2).
      # Preset default: 64
      vocab_size: 64
      # Integer >= 1; model width, must be divisible by heads.
      # Preset default: 32
      width: 32
      # Even integer >= 2; width must be divisible by heads (TP=2).
      # Preset default: 2
      heads: 2
      # Finite number > 0 for parameter updates; TP enforces > 0.
      # Preset default: 0.001
      learning_rate: 0.001
      # Finite number >= 0; AdamW weight decay.
      # Preset default: 0.01
      weight_decay: 0.01
      # Finite number > 0; AdamW stabilization; see the FP16 lower bound above.
      # Preset default: 0.0001
      adam_eps: 0.0001
      # Nonempty list without duplicates; choices: float32 | float16 | bfloat16 | float64.
      # Preset default: ["float32", "float16", "bfloat16", "float64"]
      dtypes: ["float32", "float16", "bfloat16", "float64"]
